# Render Blueprint for the public BRYME website.
# The Node service provides explicit redirects, 404/410 status codes, security
# headers and a strict public-file boundary that a generic static host cannot.
services:
  - type: web
    name: bryme-website
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TELEGRAM_ENABLED
        value: "0"
      - key: WATCHDOG
        value: "off"
