      - { type: redirect, source: /terms/*, destination: /writers/terms/* }
      - { type: redirect, source: /tested, destination: /writers/tested/ }
      - { type: redirect, source: /tested/, destination: /writers/tested/ }
      - { type: redirect, source: /tested/*, destination: /writers/tested/* }
      - { type: redirect, source: /today, destination: /writers/today/ }
      - { type: redirect, source: /today/, destination: /writers/today/ }
      - { type: redirect, source: /today/*, destination: /writers/today/* }
      - { type: redirect, source: /tools, destination: /writers/tools/ }
      - { type: redirect, source: /tools/, destination: /writers/tools/ }
      - { type: redirect, source: /tools/*, destination: /writers/tools/* }
      - { type: redirect, source: /tracker, destination: /writers/tracker/ }
      - { type: redirect, source: /tracker/, destination: /writers/tracker/ }
      - { type: redirect, source: /tracker/*, destination: /writers/tracker/* }
      - { type: redirect, source: /verification, destination: /writers/verification/ }
      - { type: redirect, source: /verification/, destination: /writers/verification/ }
      - { type: redirect, source: /verification/*, destination: /writers/verification/* }
      - { type: redirect, source: /writing, destination: /writers/writing/ }
      - { type: redirect, source: /writing/, destination: /writers/writing/ }
      - { type: redirect, source: /writing/*, destination: /writers/writing/* }
      - { type: redirect, source: /writing-opportunities, destination: /writers/writing-opportunities/ }
      - { type: redirect, source: /writing-opportunities/, destination: /writers/writing-opportunities/ }
      - { type: redirect, source: /writing-opportunities/*, destination: /writers/writing-opportunities/* }
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Custom-domain readiness: set SITE_URL to the canonical origin once the
      # custom domain is live (e.g. https://bryme.example.com). All generated
      # canonicals, sitemaps, JSON-LD and internal URLs follow this value.
      - key: SITE_URL
        sync: false
      - key: INDEXING_API_TOKEN
        sync: false
      - key: GOOGLE_INDEXING_CREDENTIALS
        sync: false
