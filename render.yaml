services:
  - type: static
    name: bryme-website
    rootDir: .
    plan: free
    # `npm run build` already runs build-routing.py and build-public-dir.py, in the
    # order that works: build-writing-first regenerates an unrouted writers tree,
    # then routing prefixes it into /writers/, then public/ is published.
    #
    # The two extra steps that used to follow were removed because they cannot
    # succeed here. Verified on a pristine clone at 7f3e0f2:
    #   - build-routing.py re-run on an already-routed tree hits its own guard and
    #     exits 1 ("tree is already routed - rebuild clean (rm -rf writers ...)
    #     first, aborting"), which failed the whole && chain on every deploy.
    #   - build-ecosystem.py re-run rewrites 186 files under ecosystem/ that are
    #     not then propagated to public/ (routing has already aborted), so it
    #     added churn and no output.
    buildCommand: npm install --omit=dev && npm run build
    staticPublishPath: public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    autoDeploy: true
    # Legacy URLs from the pre-BRYME multi-niche site. These were previously
    # kept in a Netlify-style `_redirects` file, which Render does NOT read —
    # so /opportunities and /jobs were returning 404 to anyone arriving from
    # an old Google result, and a stale dashboard rule was sending /make-money
    # to /opportunities/ (a noindex page). Declared here they are honoured,
    # version-controlled, and reviewable.
    # Destinations updated 2026-09-15 to the routed scheme. The writers' pages
    # moved under /writers/, so the previous targets (/writing/,
    # /writing-opportunities/) no longer exist in the published artifact and
    # each of these rules was sending old links to a 404. Kept in step with the
    # _redirects file, which server/server.js reads for local tests.
    routes:
      - { type: redirect, source: /opportunities, destination: /writers/writing/ }
      - { type: redirect, source: /opportunities/*, destination: /writers/writing/ }
      - { type: redirect, source: /jobs, destination: /writers/writing/ }
      - { type: redirect, source: /jobs/*, destination: /writers/writing/ }
      - { type: redirect, source: /make-money, destination: /writers/writing/ }
      - { type: redirect, source: /make-money/*, destination: /writers/writing/ }
      # Removed 2026-09-15: `/tech` and `/tech/*` used to 301 to `/guides/`.
      # That predates Tech becoming a live property — /tech/ now serves 182
      # indexable pages (see tech/sitemap.xml), so the rule only ever fired for
      # a /tech/ URL with no committed file, silently soft-redirecting a missing
      # page to /guides/ instead of letting it 404. Verified live: /tech/ and
      # /tech/<article>/ already return 200 because static files take precedence,
      # so removing these changes nothing that works and stops the soft-404s.
      # Retired 2026-09-07: the old country-discovery page duplicated
      # /writing-opportunities/. One country entry point; old URL 301s to it.
      - { type: redirect, source: /writing/by-country, destination: /writers/writing-opportunities/ }
      - { type: redirect, source: /writing/by-country/*, destination: /writers/writing-opportunities/ }
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Custom-domain readiness: set SITE_URL to the canonical origin once the
      # custom domain is live (e.g. https://bryme.example.com). All generated
      # canonicals, sitemaps, JSON-LD and internal URLs follow this value.
      - key: SITE_URL
        sync: false
      - key: INDEXING_API_TOKEN
        sync: false
      - key: GOOGLE_INDEXING_CREDENTIALS
        sync: false
