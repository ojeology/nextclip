services:
  - type: static
    name: bryme-website
    rootDir: .
    plan: free
    # Custom domain (blueprint-managed): Render syncs this list. If the service was
    # NOT created from this blueprint, this line is inert and the domain must be
    # added in dashboard Settings -> Custom Domains instead.
    domains:
      - thebryme.com
    # Clean-start per owner (20 Sep): the .onrender.com subdomain stops serving
    # entirely — no redirects, the site exists at exactly one address.
    renderSubdomainPolicy: disabled
    # `npm run build` already runs build-routing.py and build-public-dir.py, in the
    # order that works: build-writing-first regenerates an unrouted writers tree,
    # then routing prefixes it into /writers/, then public/ is published.
    #
    # The pre-build sweep is a stale-workspace guard. Render caches the build
    # workspace between deploys and `npm run build` never deletes, so output from
    # an older vintage could be published as index,follow duplicates of the
    # /writers/ pages, or as pages from desks that no longer exist. The sweep
    # removes those directories and the stale public/ copies before the build,
    # then the build recreates the current artifact from tracked sources. It is a
    # no-op on a clean checkout.
    #
    # Ordering is safe because `npm run build` runs under `set -e` and fails hard:
    # if a generator dies the && chain aborts and Render publishes nothing rather
    # than a partial artifact.
    staticPublishPath: public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    autoDeploy: true
    # Legacy URLs. `_redirects` is a Netlify-style file that Render does NOT read,
    # so the same scheme is declared here, where it is honoured, version-controlled
    # and reviewable - and scripts/purge-stale-publish.py additionally writes
    # file-level stubs for it inside `npm run build`, because a published file
    # outranks an edge rule. Keep this block and that script in step: it parses
    # this file.
    #
    # Two families of rule:
    #   - the retired hubs (/jobs, /make-money, /opportunities) 301 to the
    #     Writers market directory, so an old inbound link still lands on the
    #     thing it was looking for;
    #   - the pre-routing writers scheme 301s every legacy URL to its exact
    #     routed twin (/writing/<slug>/ -> /writers/writing/<slug>/), because
    #     Render supports wildcard capture in the destination. Every destination
    #     was checked against content/index-allowlist.routed.json, so no rule can
    #     301 to a 404. /about/ is deliberately absent - it is a live page.
    routes:
      # batch #7 (25 Sep): saving-for-a-house-deposit-explained shipped as an
      # unintentional duplicate of the older how-to-save-for-a-house-deposit
      # guide; the page was removed the same day. The 301 keeps any indexed or
      # linked copy pointing at the surviving page. Restored with the Money
      # desk relaunch 2026-10-03.
      - { type: redirect, source: /opportunities, destination: /writers/writing/ }
      - { type: redirect, source: /opportunities/*, destination: /writers/writing/ }
      - { type: redirect, source: /jobs, destination: /writers/writing/ }
      - { type: redirect, source: /jobs/*, destination: /writers/writing/ }
      - { type: redirect, source: /make-money, destination: /writers/writing/ }
      - { type: redirect, source: /make-money/*, destination: /writers/writing/ }
      # Removed 2026-09-15: `/tech` and `/tech/*` used to 301 to `/guides/`.
      # That predates Tech becoming a live property — /tech/ now serves 182
      # indexable pages (see tech/sitemap.xml), so the rule only ever fired for
      # a /tech/ URL with no committed file, silently soft-redirecting a missing
      # page to /guides/ instead of letting it 404. Verified live: /tech/ and
      # /tech/<article>/ already return 200 because static files take precedence,
      # so removing these changes nothing that works and stops the soft-404s.
      # Retired 2026-09-07: the old country-discovery page duplicated
      # /writing-opportunities/. One country entry point; old URL 301s to it.
      - { type: redirect, source: /writing/by-country, destination: /writers/writing-opportunities/ }
      - { type: redirect, source: /writing/by-country/*, destination: /writers/writing-opportunities/ }
      # 2026-09-16: kept from the dashboard-era set - the only two stale rules
      # whose sources have no published page or stub twin and whose
      # destinations are live articles (both verified 200). purge-stale-publish
      # skips nested sources, so these are edge-only; _redirects mirrors them
      # for the local test server.
      # Pre-routing writers' scheme (batch 32). These 32 path segments held the
      # writers' publication before the routing migration moved it under
      # /writers/. Render supports wildcard capture in the destination, so each
      # legacy URL 301s to its exact routed twin (/writing/the-republic/ ->
      # /writers/writing/the-republic/) rather than flattening to a hub. All 508
      # legacy routes were checked against content/index-allowlist.routed.json:
      # every destination resolves, so no rule can 301 to a 404. /about/ is
      # deliberately absent - it is a live indexable root page. These rules only
      # fire once the stale cached copies are gone (see buildCommand above),
      # because a published file takes precedence over a rule. Listed after the
      # specific /writing/by-country rules so those keep matching first.
      - { type: redirect, source: /author, destination: /writers/author/ibrahim-sodiq/ }
      - { type: redirect, source: /author/, destination: /writers/author/ibrahim-sodiq/ }
      - { type: redirect, source: /author/*, destination: /writers/author/* }
      - { type: redirect, source: /checklists, destination: /writers/checklists/ }
      - { type: redirect, source: /checklists/, destination: /writers/checklists/ }
      - { type: redirect, source: /checklists/*, destination: /writers/checklists/* }
      - { type: redirect, source: /compare, destination: /writers/compare/ }
      - { type: redirect, source: /compare/, destination: /writers/compare/ }
      - { type: redirect, source: /compare/*, destination: /writers/compare/* }
      - { type: redirect, source: /contact, destination: /writers/contact/ }
      - { type: redirect, source: /contact/, destination: /writers/contact/ }
      - { type: redirect, source: /contact/*, destination: /writers/contact/* }
      - { type: redirect, source: /copyright, destination: /writers/copyright/ }
      - { type: redirect, source: /copyright/, destination: /writers/copyright/ }
      - { type: redirect, source: /copyright/*, destination: /writers/copyright/* }
      - { type: redirect, source: /corrections, destination: /writers/corrections/ }
      - { type: redirect, source: /corrections/, destination: /writers/corrections/ }
      - { type: redirect, source: /corrections/*, destination: /writers/corrections/* }
      - { type: redirect, source: /disclaimer, destination: /writers/disclaimer/ }
      - { type: redirect, source: /disclaimer/, destination: /writers/disclaimer/ }
      - { type: redirect, source: /disclaimer/*, destination: /writers/disclaimer/* }
      - { type: redirect, source: /disclosure, destination: /writers/disclosure/ }
      - { type: redirect, source: /disclosure/, destination: /writers/disclosure/ }
      - { type: redirect, source: /disclosure/*, destination: /writers/disclosure/* }
      - { type: redirect, source: /editorial-policy, destination: /writers/editorial-policy/ }
      - { type: redirect, source: /editorial-policy/, destination: /writers/editorial-policy/ }
      - { type: redirect, source: /editorial-policy/*, destination: /writers/editorial-policy/* }
      - { type: redirect, source: /essays, destination: /writers/essays/ }
      - { type: redirect, source: /essays/, destination: /writers/essays/ }
      - { type: redirect, source: /essays/*, destination: /writers/essays/* }
      - { type: redirect, source: /find, destination: /writers/find/ }
      - { type: redirect, source: /find/, destination: /writers/find/ }
      - { type: redirect, source: /find/*, destination: /writers/find/* }
      - { type: redirect, source: /glossary, destination: /writers/glossary/ }
      - { type: redirect, source: /glossary/, destination: /writers/glossary/ }
      - { type: redirect, source: /glossary/*, destination: /writers/glossary/* }
      - { type: redirect, source: /guides, destination: /writers/guides/ }
      - { type: redirect, source: /guides/, destination: /writers/guides/ }
      - { type: redirect, source: /guides/*, destination: /writers/guides/* }
      - { type: redirect, source: /intelligence, destination: /writers/intelligence/ }
      - { type: redirect, source: /intelligence/, destination: /writers/intelligence/ }
      - { type: redirect, source: /intelligence/*, destination: /writers/intelligence/* }
      - { type: redirect, source: /learn, destination: /writers/learn/ }
      - { type: redirect, source: /learn/, destination: /writers/learn/ }
      - { type: redirect, source: /learn/*, destination: /writers/learn/* }
      - { type: redirect, source: /newsletter, destination: /writers/newsletter/ }
      - { type: redirect, source: /newsletter/, destination: /writers/newsletter/ }
      - { type: redirect, source: /newsletter/*, destination: /writers/newsletter/* }
      - { type: redirect, source: /problems, destination: /writers/problems/ }
      - { type: redirect, source: /problems/, destination: /writers/problems/ }
      - { type: redirect, source: /problems/*, destination: /writers/problems/* }
      - { type: redirect, source: /read, destination: /writers/read/ }
      - { type: redirect, source: /read/, destination: /writers/read/ }
      - { type: redirect, source: /read/*, destination: /writers/read/* }
      - { type: redirect, source: /regional, destination: /writers/regional/ }
      - { type: redirect, source: /regional/, destination: /writers/regional/ }
      - { type: redirect, source: /regional/*, destination: /writers/regional/* }
      - { type: redirect, source: /search, destination: /writers/search/ }
      - { type: redirect, source: /search/, destination: /writers/search/ }
      - { type: redirect, source: /search/*, destination: /writers/search/* }
      - { type: redirect, source: /start, destination: /writers/start/ }
      - { type: redirect, source: /start/, destination: /writers/start/ }
      - { type: redirect, source: /start/*, destination: /writers/start/* }
      - { type: redirect, source: /studio, destination: /writers/studio/ }
      - { type: redirect, source: /studio/, destination: /writers/studio/ }
      - { type: redirect, source: /studio/*, destination: /writers/studio/* }
      - { type: redirect, source: /templates, destination: /writers/templates/ }
      - { type: redirect, source: /templates/, destination: /writers/templates/ }
      - { type: redirect, source: /templates/*, destination: /writers/templates/* }
      - { type: redirect, source: /terms, destination: /writers/terms/ }
      - { type: redirect, source: /terms/, destination: /writers/terms/ }
      - { type: redirect, source: /terms/*, destination: /writers/terms/* }
      - { type: redirect, source: /tested, destination: /writers/tested/ }
      - { type: redirect, source: /tested/, destination: /writers/tested/ }
      - { type: redirect, source: /tested/*, destination: /writers/tested/* }
      - { type: redirect, source: /today, destination: /writers/today/ }
      - { type: redirect, source: /today/, destination: /writers/today/ }
      - { type: redirect, source: /today/*, destination: /writers/today/* }
      - { type: redirect, source: /tools, destination: /writers/tools/ }
      - { type: redirect, source: /tools/, destination: /writers/tools/ }
      # Batch 14j: no-slash legacy forms of the 8 tech-hosted tools. The with-slash
      # forms are served by the committed meta-refresh stubs under public/tools/
      # (files outrank rules); extension-less paths match no file, so without these
      # literals the /tools/* wildcard below would 301 them to a 404. Synced to the
      # live rule table via PUT /v1/services/{id}/routes (priority = list order).
      - { type: redirect, source: /tools/*, destination: /writers/tools/* }
      - { type: redirect, source: /tracker, destination: /writers/tracker/ }
      - { type: redirect, source: /tracker/, destination: /writers/tracker/ }
      - { type: redirect, source: /tracker/*, destination: /writers/tracker/* }
      - { type: redirect, source: /verification, destination: /writers/verification/ }
      - { type: redirect, source: /verification/, destination: /writers/verification/ }
      - { type: redirect, source: /verification/*, destination: /writers/verification/* }
      - { type: redirect, source: /writing, destination: /writers/writing/ }
      - { type: redirect, source: /writing/, destination: /writers/writing/ }
      - { type: redirect, source: /writing/*, destination: /writers/writing/* }
      - { type: redirect, source: /writing-opportunities, destination: /writers/writing-opportunities/ }
      - { type: redirect, source: /writing-opportunities/, destination: /writers/writing-opportunities/ }
      - { type: redirect, source: /writing-opportunities/*, destination: /writers/writing-opportunities/* }
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Custom-domain readiness: set SITE_URL to the canonical origin once the
      # custom domain is live (e.g. https://bryme.example.com). All generated
      # canonicals, sitemaps, JSON-LD and internal URLs follow this value.
      - key: SITE_URL
        sync: false
