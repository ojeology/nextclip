services:
  - type: static
    name: bryme-website
    rootDir: .
    plan: free
    # `npm run build` already runs build-routing.py and build-public-dir.py, in the
    # order that works: build-writing-first regenerates an unrouted writers tree,
    # then routing prefixes it into /writers/, then public/ is published.
    #
    # The two extra steps that used to follow were removed because they cannot
    # succeed here. Verified on a pristine clone at 7f3e0f2:
    #   - build-routing.py re-run on an already-routed tree hits its own guard and
    #     exits 1 ("tree is already routed - rebuild clean (rm -rf writers ...)
    #     first, aborting"), which failed the whole && chain on every deploy.
    #   - build-ecosystem.py re-run rewrites 186 files under ecosystem/ that are
    #     not then propagated to public/ (routing has already aborted), so it
    #     added churn and no output.
    # The trailing `git clean` is the duplicate-content fix. Render caches the
    # build workspace between deploys and `npm run build` never deletes, so
    # untracked output from an older vintage (public/writing/, public/guides/,
    # public/learn/, ... from 2026-09-14) kept being published as index,follow
    # duplicates of the identical /writers/ pages - and because a published
    # file wins over a redirect rule, the 301s below could never fire for them.
    # Verified: `rm -rf public && npm run build` regenerates all 2,728 tracked
    # files with 0 deletions and 0 untracked additions, so removing untracked
    # files from the publish directory after a successful build is safe. It runs
    # AFTER the build because `npm run build` swallows failures with `|| echo`,
    # and deleting public/ first would then deploy an empty site.
    buildCommand: npm install --omit=dev && npm run build && (git -c safe.directory='*' clean -xdf public/ || echo 'clean - git clean unavailable, untracked publish files may persist')
    staticPublishPath: public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    autoDeploy: true
    # Legacy URLs from the pre-BRYME multi-niche site. These were previously
    # kept in a Netlify-style `_redirects` file, which Render does NOT read —
    # so /opportunities and /jobs were returning 404 to anyone arriving from
    # an old Google result, and a stale dashboard rule was sending /make-money
    # to /opportunities/ (a noindex page). Declared here they are honoured,
    # version-controlled, and reviewable.
    # Destinations updated 2026-09-15 to the routed scheme. The writers' pages
    # moved under /writers/, so the previous targets (/writing/,
    # /writing-opportunities/) no longer exist in the published artifact and
    # each of these rules was sending old links to a 404. Kept in step with the
    # _redirects file, which server/server.js reads for local tests.
    # 2026-09-16 finding: the live service does NOT apply this routes block.
    # Production still runs dashboard-era rules that predate this file (/tech
    # 301s to /guides/, /make-money 301s to /opportunities/) and none of the
    # rules below fire (/opportunities, /jobs, /author, /guides return bare
    # 404 live). Until the site is re-synced to this blueprint (or the stale
    # dashboard rules are deleted), scripts/purge-stale-publish.py enforces
    # the same scheme at file level inside `npm run build`: it purges the
    # stale 2026-09-14 root directories from the cached publish workspace
    # (the buildCommand git-clean below never ran on Render - its || echo
    # fallback swallowed the failure) and ships noindex meta-refresh stubs
    # for every legacy URL these rules cover. Keep this block and that
    # script's parsed destinations in step: it reads this file.
    routes:
      - { type: redirect, source: /opportunities, destination: /writers/writing/ }
      - { type: redirect, source: /opportunities/*, destination: /writers/writing/ }
      - { type: redirect, source: /jobs, destination: /writers/writing/ }
      - { type: redirect, source: /jobs/*, destination: /writers/writing/ }
      - { type: redirect, source: /make-money, destination: /writers/writing/ }
      - { type: redirect, source: /make-money/*, destination: /writers/writing/ }
      # Removed 2026-09-15: `/tech` and `/tech/*` used to 301 to `/guides/`.
      # That predates Tech becoming a live property — /tech/ now serves 182
      # indexable pages (see tech/sitemap.xml), so the rule only ever fired for
      # a /tech/ URL with no committed file, silently soft-redirecting a missing
      # page to /guides/ instead of letting it 404. Verified live: /tech/ and
      # /tech/<article>/ already return 200 because static files take precedence,
      # so removing these changes nothing that works and stops the soft-404s.
      # Retired 2026-09-07: the old country-discovery page duplicated
      # /writing-opportunities/. One country entry point; old URL 301s to it.
      - { type: redirect, source: /writing/by-country, destination: /writers/writing-opportunities/ }
      - { type: redirect, source: /writing/by-country/*, destination: /writers/writing-opportunities/ }
      # Pre-routing writers' scheme (batch 32). These 32 path segments held the
      # writers' publication before the routing migration moved it under
      # /writers/. Render supports wildcard capture in the destination, so each
      # legacy URL 301s to its exact routed twin (/writing/the-republic/ ->
      # /writers/writing/the-republic/) rather than flattening to a hub. All 508
      # legacy routes were checked against content/index-allowlist.routed.json:
      # every destination resolves, so no rule can 301 to a 404. /about/ is
      # deliberately absent - it is a live indexable root page. These rules only
      # fire once the stale cached copies are gone (see buildCommand above),
      # because a published file takes precedence over a rule. Listed after the
      # specific /writing/by-country rules so those keep matching first.
      - { type: redirect, source: /author, destination: /writers/author/ibrahim-sodiq/ }
      - { type: redirect, source: /author/, destination: /writers/author/ibrahim-sodiq/ }
      - { type: redirect, source: /author/*, destination: /writers/author/* }
      - { type: redirect, source: /checklists, destination: /writers/checklists/ }
      - { type: redirect, source: /checklists/, destination: /writers/checklists/ }
      - { type: redirect, source: /checklists/*, destination: /writers/checklists/* }
      - { type: redirect, source: /compare, destination: /writers/compare/ }
      - { type: redirect, source: /compare/, destination: /writers/compare/ }
      - { type: redirect, source: /compare/*, destination: /writers/compare/* }
      - { type: redirect, source: /contact, destination: /writers/contact/ }
      - { type: redirect, source: /contact/, destination: /writers/contact/ }
      - { type: redirect, source: /contact/*, destination: /writers/contact/* }
      - { type: redirect, source: /copyright, destination: /writers/copyright/ }
      - { type: redirect, source: /copyright/, destination: /writers/copyright/ }
      - { type: redirect, source: /copyright/*, destination: /writers/copyright/* }
      - { type: redirect, source: /corrections, destination: /writers/corrections/ }
      - { type: redirect, source: /corrections/, destination: /writers/corrections/ }
      - { type: redirect, source: /corrections/*, destination: /writers/corrections/* }
      - { type: redirect, source: /disclaimer, destination: /writers/disclaimer/ }
      - { type: redirect, source: /disclaimer/, destination: /writers/disclaimer/ }
      - { type: redirect, source: /disclaimer/*, destination: /writers/disclaimer/* }
      - { type: redirect, source: /disclosure, destination: /writers/disclosure/ }
      - { type: redirect, source: /disclosure/, destination: /writers/disclosure/ }
      - { type: redirect, source: /disclosure/*, destination: /writers/disclosure/* }
      - { type: redirect, source: /editorial-policy, destination: /writers/editorial-policy/ }
      - { type: redirect, source: /editorial-policy/, destination: /writers/editorial-policy/ }
      - { type: redirect, source: /editorial-policy/*, destination: /writers/editorial-policy/* }
      - { type: redirect, source: /essays, destination: /writers/essays/ }
      - { type: redirect, source: /essays/, destination: /writers/essays/ }
      - { type: redirect, source: /essays/*, destination: /writers/essays/* }
      - { type: redirect, source: /find, destination: /writers/find/ }
      - { type: redirect, source: /find/, destination: /writers/find/ }
      - { type: redirect, source: /find/*, destination: /writers/find/* }
      - { type: redirect, source: /glossary, destination: /writers/glossary/ }
      - { type: redirect, source: /glossary/, destination: /writers/glossary/ }
      - { type: redirect, source: /glossary/*, destination: /writers/glossary/* }
      - { type: redirect, source: /guides, destination: /writers/guides/ }
      - { type: redirect, source: /guides/, destination: /writers/guides/ }
      - { type: redirect, source: /guides/*, destination: /writers/guides/* }
      - { type: redirect, source: /intelligence, destination: /writers/intelligence/ }
      - { type: redirect, source: /intelligence/, destination: /writers/intelligence/ }
      - { type: redirect, source: /intelligence/*, destination: /writers/intelligence/* }
      - { type: redirect, source: /learn, destination: /writers/learn/ }
      - { type: redirect, source: /learn/, destination: /writers/learn/ }
      - { type: redirect, source: /learn/*, destination: /writers/learn/* }
      - { type: redirect, source: /newsletter, destination: /writers/newsletter/ }
      - { type: redirect, source: /newsletter/, destination: /writers/newsletter/ }
      - { type: redirect, source: /newsletter/*, destination: /writers/newsletter/* }
      - { type: redirect, source: /privacy, destination: /writers/privacy/ }
      - { type: redirect, source: /privacy/, destination: /writers/privacy/ }
      - { type: redirect, source: /privacy/*, destination: /writers/privacy/* }
      - { type: redirect, source: /problems, destination: /writers/problems/ }
      - { type: redirect, source: /problems/, destination: /writers/problems/ }
      - { type: redirect, source: /problems/*, destination: /writers/problems/* }
      - { type: redirect, source: /read, destination: /writers/read/ }
      - { type: redirect, source: /read/, destination: /writers/read/ }
      - { type: redirect, source: /read/*, destination: /writers/read/* }
      - { type: redirect, source: /regional, destination: /writers/regional/ }
      - { type: redirect, source: /regional/, destination: /writers/regional/ }
      - { type: redirect, source: /regional/*, destination: /writers/regional/* }
      - { type: redirect, source: /search, destination: /writers/search/ }
      - { type: redirect, source: /search/, destination: /writers/search/ }
      - { type: redirect, source: /search/*, destination: /writers/search/* }
      - { type: redirect, source: /start, destination: /writers/start/ }
      - { type: redirect, source: /start/, destination: /writers/start/ }
      - { type: redirect, source: /start/*, destination: /writers/start/* }
      - { type: redirect, source: /studio, destination: /writers/studio/ }
      - { type: redirect, source: /studio/, destination: /writers/studio/ }
      - { type: redirect, source: /studio/*, destination: /writers/studio/* }
      - { type: redirect, source: /templates, destination: /writers/templates/ }
      - { type: redirect, source: /templates/, destination: /writers/templates/ }
