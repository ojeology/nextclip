name: BRYME quality gate

# Automated sports publishing is intentionally paused until source rights and
# production data integrity are approved. This workflow validates; it never
# mutates content, creates branches or deploys from a scheduled bot run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bryme-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check deterministic builders
        run: python3 -m py_compile scripts/build-content-css.py scripts/build-focus-site.py scripts/build-discovery.py scripts/apply-audit-remediation.py
      - name: Confirm committed HTML is fully remediated
        run: python3 scripts/apply-audit-remediation.py --check
      - name: Run repository and HTTP release gates
        run: npm test
