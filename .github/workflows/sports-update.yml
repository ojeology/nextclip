name: Sports data update

# The BRYME Sport data agent: fetches verified tables/results/scorers and,
# if anything changed, rebuilds the site and pushes it (Render auto-deploys).
# One-time setup: add a free football-data.org key as the repository secret
# FOOTBALL_DATA_API_KEY (https://www.football-data.org/client/register).

on:
  schedule:
    - cron: "0 6 * * *"    # 06:00 UTC daily
    - cron: "0 22 * * *"   # 22:00 UTC daily (after evening rounds)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sports-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch live football data
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python3 scripts/sports_update_agent.py

      # Pin the build date once for the whole rebuild: fetch, build-ecosystem
      # and npm run build together can cross midnight UTC (the 2026-09-17
      # 22:00 run committed at 00:15 with the source tree stamped the
      # previous day and public/ stamped the next - an internally mixed tree
      # that no single-date rebuild can reproduce, which failed the quality
      # gate's determinism check and skipped npm test). With the pin every
      # build step stamps the same UTC date, so the committed tree is always
      # reproducible by the gate.
      - name: Pin the build date for this run
        run: echo "SOURCE_DATE_EPOCH=$(date -u -d "$(date -u +%Y-%m-%d)" +%s)" >> "$GITHUB_ENV"

      - name: Rebuild site if data changed
        id: build
        run: |
          if git diff --quiet -- content/sports-live.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes since last build - nothing to do."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          npm ci
          npx playwright install --with-deps chromium
          python3 scripts/build-ecosystem.py
          npm run build
          npm test
          python3 scripts/check-internal-links.py

      - name: Commit and push
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name "BRYME data agent"
          git config user.email "agents@bryme.local"
          # `npm run build` regenerates EVERY desk, not just this one: the
          # routing and title steps re-derive titles site-wide, so a rebuild
          # also rewrites home/, fitness/, entertainment/ and the writers desk.
          #
          # This step used to commit `content/sports-live.json ecosystem public
          # sports` only. The rest of the rebuild was left in the runner and
          # thrown away, so the committed tree stopped matching a fresh build -
          # and the NEXT quality run failed at "Confirm deterministic output",
          # which skips `npm audit` and `npm test` (run 36726014320 failed that
          # way, on a tree publishing a truncated title on a home/ page).
          #
          # The bot's own `npm test` cannot catch this: it runs against a tree
          # that was just rebuilt, so it is self-consistent by construction. The
          # inconsistency is created by the subset commit itself.
          #
          # `-u` stages every modified TRACKED file and no untracked ones, so the
          # rebuilt tree is committed whole without sweeping in stray files.
          git add -u
          # validate:techhub rewrites its own report images during `npm test`.
          # They are regenerated on every run and are deliberately not committed.
          # HEAD is named explicitly: a bare `git checkout -- reports/` restores
          # from the INDEX, which after `git add -u` still holds the modified
          # files, so it unstages nothing (verified). Naming HEAD updates the
          # index and the worktree together, which is what discards them.
          git checkout HEAD -- reports/
          git commit -m "sports-data: auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
