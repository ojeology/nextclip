name: BRYME work-publication quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  # A twice-daily re-run of the full gate on whatever HEAD is. Nothing published
  # here is generated by a scheduled agent, but a build that was byte-reproducible
  # yesterday should still be byte-reproducible today - and date-derived output
  # (deadline statuses, sitemap lastmod) is exactly where that can rot silently.
  schedule:
    - cron: "30 7 * * *"
    - cron: "30 23 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Pin the build date to the tree's OWN date of record, not the commit
      # timestamp. The generators derive the deadline->closed flips, the
      # "%B %Y" edition line, the "Counts verified (last: ...)" stamp and
      # every sitemap <lastmod> from the current date. The committed root
      # sitemap's <lastmod> is the tree's date of record; the fallback is the
      # commit's own date. Production deploys set no pin, so the live site stays
      # date-fresh; only CI pins, to compare like with like.
      - name: Pin the build date to the tree
        run: |
          D=$(git show HEAD:public/sitemap.xml | grep -oE '<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1 | sed 's/<lastmod>//')
          [ -n "$D" ] || D=$(git log -1 --format=%cd --date=short)
          echo "pinned build date: $D"
          echo "SOURCE_DATE_EPOCH=$(date -u -d "$D" +%s)" >> "$GITHUB_ENV"
      # `npm run build` runs under `set -e`: if any generator dies, this step
      # fails. It used to end in `|| echo '... using committed static output'`,
      # which exited 0 on a crashed generator - and because the committed output
      # was then left untouched, `git diff --exit-code` below PASSED on an empty
      # diff and `npm test` audited stale pages. A fully green run on a broken
      # build. Fixed 21 Sep 2026.
      - run: npm run build
      - name: Confirm deterministic output
        run: git diff --exit-code
      - run: npm audit --audit-level=high
      - run: npm test
