# BRYME public website
#
# This service MUST serve the website (HTML pages), not a Telegram bot.
# Telegram is off unless you set TELEGRAM_ENABLED=1 (webhook only at /telegram/webhook).
#
# Render: Web Service → repo ojeology/nextclip
#   Root Directory:  server
#   Build command:   npm install
#   Start command:   node server.js
#
# If this URL is bryme.onrender.com, crawlers get the real site again.
services:
  - type: web
    name: bryme-website
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20.11.1"
      - key: TELEGRAM_ENABLED
        value: "0"
