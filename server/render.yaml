services:
  - type: web
    name: bryme-website
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SITE_URL
        sync: false
      - key: INDEXING_API_TOKEN
        sync: false
      - key: GOOGLE_INDEXING_CREDENTIALS
        sync: false
