services:
  - type: web
    name: bryme-website
    runtime: node
    rootDir: ../
    plan: free
    buildCommand: npm install --omit=dev && (npm run build || echo "build: using committed static output")
    startCommand: node server/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SITE_URL
        sync: false
      - key: INDEXING_API_TOKEN
        sync: false
      - key: GOOGLE_INDEXING_CREDENTIALS
        sync: false
